<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../navigation.css" />
  </head>
  <body>
    <nav class="site-header">
      <a href="../index.html" class="logo">INJAIRU.</a>

      <button
        class="menu-toggle"
        id="menu-toggle"
        aria-expanded="false"
        aria-controls="main-navigation"
        type="button"
      >
        ☰
      </button>

      <div class="main-nav" id="main-navigation">
        <a href="../index.html">Home</a>
        <a href="about.html">About</a>

      </div>
    </nav>
    <header>
      <h1>Contact Me</h1>
      <p>Have a project in mind? Send me a message.</p>
    </header>
    <main>
      <form action="https://formspree.io/f/xyeeapvj" method="POST">
        <label for="name">Your name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="e.g. Injairu Luvita"
          required
        />
        <label for="email">Your email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
        />
        <label for="message">Your message</label>
        <textarea
          id="message"
          name="message"
          rows="5"
          placeholder="Tell me a little about your project..."
          required
        ></textarea>
        <button type="submit">Send Message</button>
      </form>
    </main>

    <script src="../navigation.js"></script>
  </body>
</html>
